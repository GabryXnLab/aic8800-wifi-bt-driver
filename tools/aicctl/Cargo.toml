[package]
name = "aicctl"
version = "0.1.0"
edition = "2021"
description = "CLI per l'interfaccia vendor nl80211 del driver aic8800_fdrv (chiavetta AIC8800D80)"
license = "GPL-2.0-only"
rust-version = "1.74"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
strip = true
