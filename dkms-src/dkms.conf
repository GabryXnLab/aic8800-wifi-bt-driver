PACKAGE_NAME="aic8800"
PACKAGE_VERSION="radxa"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic_load_fw modules && make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic8800_fdrv modules KBUILD_EXTRA_SYMBOLS=${dkms_tree}/aic8800/radxa/build/aic_load_fw/Module.symvers && make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic_btusb CONFIG_PLATFORM_UBUNTU=y modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic_load_fw clean; make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic8800_fdrv clean; make -C ${kernel_source_dir} M=${dkms_tree}/aic8800/radxa/build/aic_btusb clean"

BUILT_MODULE_NAME[0]="aic_load_fw"
BUILT_MODULE_LOCATION[0]="aic_load_fw"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="aic8800_fdrv"
BUILT_MODULE_LOCATION[1]="aic8800_fdrv"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="aic_btusb"
BUILT_MODULE_LOCATION[2]="aic_btusb"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"
